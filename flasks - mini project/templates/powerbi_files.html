<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Files</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='journey.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1E1A28 0%, #2b213a 50%, #1E1A28 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(159, 105, 197, 0.2) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(204, 182, 184, 0.16) 0%, transparent 50%);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(159, 105, 197, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        .nav-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: 25px;
            color: #ff9500;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: rgba(255, 149, 0, 0.2);
            border-color: #ff9500;
            box-shadow: 0 0 20px rgba(255, 149, 0, 0.4);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 50px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff9500, #00c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .file-card {
            position: relative;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .file-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 149, 0, 0.3);
            border-color: #ff9500;
        }

        .file-icon {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }

        .file-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #ff9500;
            text-align: center;
            word-break: break-all;
        }

        .click-hint {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #ff9500;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .file-card:hover .click-hint {
            opacity: 1;
            transform: translateY(0);
        }

        .back-container {
            text-align: center;
            margin-top: 60px;
        }

        .back-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.2), rgba(0, 200, 255, 0.2));
            border: 2px solid #ff9500;
            border-radius: 30px;
            color: #ff9500;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.4), rgba(0, 200, 255, 0.4));
            box-shadow: 0 0 30px rgba(255, 149, 0, 0.5);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    {% include '_page_nav.html' %}
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="particles">
            <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 40%; animation-delay: 3s;"></div>
            <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
            <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
            <div class="particle" style="left: 70%; animation-delay: 6s;"></div>
            <div class="particle" style="left: 80%; animation-delay: 7s;"></div>
            <div class="particle" style="left: 90%; animation-delay: 8s;"></div>
        </div>
    </div>

    <div class="nav-buttons">
        <a href="{{ url_for('index') }}" class="nav-btn">Home</a>
        <a href="{{ url_for('journey') }}" class="nav-btn">Journey</a>
    </div>

    <div class="container">
        <div class="title-section">
            <h1 class="main-title">Power BI Files</h1>
            <p class="subtitle">Available Power BI Reports</p>
        </div>

        <div class="files-grid">
            {% for file in files %}
            <a href="{{ url_for('view_pbix', filename=file) }}" class="file-card">
                <span class="file-icon">📊</span>
                <div class="file-name">{{ file }}</div>
                <span class="click-hint">Click to open →</span>
            </a>
            {% endfor %}
        </div>

        <div class="back-container">
            <a href="{{ url_for('data_exploration') }}" class="back-btn">← Back to Data Exploration</a>
        </div>
    </div>
</body>
</html>
