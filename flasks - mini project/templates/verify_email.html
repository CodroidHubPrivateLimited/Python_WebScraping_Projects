<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Data Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    {% include '_page_nav.html' %}
    <div class="login-container">
        <div class="login-box">
            <h1 class="gradient-text">Verify Email</h1>
            <p class="subtitle">Verification code sent to <strong>{{ email }}</strong></p>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('verify_email') }}">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="input-group">
                    <label for="code">6-digit Code</label>
                    <input type="text" id="code" name="code" maxlength="6" placeholder="Enter verification code" required>
                </div>

                <button type="submit" class="login-btn">Verify and Create Account</button>
            </form>

            <div class="footer-links">
                <p>Wrong email? <a href="{{ url_for('signup') }}">Go back to sign up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
