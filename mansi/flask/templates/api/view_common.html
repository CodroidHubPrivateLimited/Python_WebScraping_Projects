<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dynamic.css') }}">
</head>
<body>

<a href="/api-services" class="back-btn">← Back</a>

<h1>{{ title }} API Data</h1>

{% if headers and rows %}
<table>
    <thead>
        <tr>
            {% for h in headers %}
                <th>{{ h }}</th>
            {% endfor %}
        </tr>
    </thead>

    <tbody>
        {% for row in rows %}
            <tr>
                {% for col in row %}
                    <td>{{ col }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="no-data">No data available</p>
{% endif %}

</body>
</html>
