<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Portal | Smart Campus Attendance</title>
    <script>
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="blob"></div>

        <div class="site-header">
            <header class="header">
                <div class="logo">
                    <span class="logo-mark"><i class="fas fa-check-double"></i></span>
                    Attendance Portal
                </div>
                <div class="auth-buttons">
                    <a href="{{ url_for('login') }}" class="btn btn-secondary">Login</a>
                    <a href="{{ url_for('signup') }}" class="btn btn-primary">Sign Up</a>
                    <button type="button" class="btn btn-secondary theme-toggle" onclick="toggleTheme()">Dark Mode</button>
                </div>
            </header>
        </div>

        <section class="hero" style="text-align:center; max-width: 920px;">
            <span class="eyebrow">Smart Attendance</span>
            <h1 style="max-width: 860px; margin-left:auto; margin-right:auto;">Student Attendance System</h1>
            <p style="max-width: 700px; margin-left:auto; margin-right:auto;">
                Mark attendance with face verification, manage leave requests, handle complaints, and keep student records simple in one portal.
            </p>
            <div class="hero-actions" style="justify-content:center;">
                <a href="{{ url_for('signup') }}" class="btn btn-primary">Get Started</a>
              
            </div>
        </section>
    </div>
    <script>
        function syncThemeButton() {
            const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
            const button = document.querySelector(".theme-toggle");
            if (button) {
                button.textContent = currentTheme === "dark" ? "Light Mode" : "Dark Mode";
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
            const nextTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", nextTheme);
            localStorage.setItem("theme", nextTheme);
            syncThemeButton();
        }

        syncThemeButton();
    </script>
</body>
</html>
